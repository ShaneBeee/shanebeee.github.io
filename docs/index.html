<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShaneBee JavaDocs</title>
    <style>
        :root {
            --primary: #22c55e;
            --bg: #1a1a1a;
            --text: #ecf0f1;
            --card-bg: #2c3e50;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 1000px;
            width: 90%;
            text-align: center;
            padding: 2rem;
        }
        h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.8;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 10px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 4px solid transparent;
            min-height: 60px;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border-bottom: 4px solid var(--primary);
        }
        .card h3 {
            margin: 0;
            color: var(--primary);
            font-size: 1.2rem;
        }
        .nav-link {
            display: inline-block;
            margin-top: 2rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
            transition: opacity 0.3s;
        }
        .nav-link:hover {
            opacity: 0.8;
        }
        #loading {
            margin-top: 2rem;
            font-style: italic;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>JavaDocs</h1>
        <p class="subtitle">A collection of JavaDocs for my various projects</p>
        
        <div id="loading">Loading documentation list...</div>
        <div id="list" class="grid">
        </div>

        <a href="../" class="nav-link">← Back to Home</a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js" integrity="sha512-3gJwYpMe3QewGELv8k/BX9vcqhryRdzRMxVfq6ngyWXwo03GFEzjsUm8Q7RZcHPHksttq7/GFoxjCVUjkjvPdw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        $(document).ready(function() {
            const repoOwner = "ShaneBeee";
            const repoName = "shanebeee.github.io";
            const docsPath = "docs";

            $.get(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${docsPath}`, function(data) {
                const projects = data
                    .filter(item => item.type === "dir")
                    .map(item => item.name);

                $("#loading").hide();
                if (projects.length === 0) {
                    $("#list").append("<p>No projects found.</p>");
                    return;
                }

                for(let project of projects) {
                    $("#list").append(`
                        <a href="${project}" class="card">
                            <h3>${project}</h3>
                        </a>
                    `);
                }
            }).fail(function() {
                $("#loading").hide();
                $("#list").append("<p>Failed to load JavaDocs list. GitHub API rate limit might be exceeded.</p>");
            });
        });
    </script>
</body>
</html>
